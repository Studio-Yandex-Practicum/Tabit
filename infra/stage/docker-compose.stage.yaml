services:
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:${POSTGRES_VERSION}
    env_file:
      - /home/${SERVER_USERNAME}/tabit/infra/stage/.env
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ${NETWORK_NAME}
    restart: always

  app:
    container_name: ${APP_CONTAINER_NAME}
    image: ${IMAGE_REGISTRY}/${IMAGE_PATH}:latest
    env_file:
      - /home/${SERVER_USERNAME}/tabit/infra/stage/.env
    environment:
      - DB_HOST=${DB_CONTAINER_NAME}
      - POETRY_VIRTUALENVS_IN_PROJECT=true
      - PATH="/app/.venv/bin:$PATH"
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - db
    volumes:
      - app_media:/app/media
    networks:
      - ${NETWORK_NAME}
    restart: on-failure:3

  pgadmin:
    container_name: ${PGADMIN_CONTAINER_NAME}
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    env_file:
      - /home/${SERVER_USERNAME}/tabit/infra/stage/.env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - /home/${SERVER_USERNAME}/tabit/pgadmin/config_local.py:/pgadmin4/config_local.py
      - /home/${SERVER_USERNAME}/tabit/pgadmin/create-admin-folder.sh:/create-admin-folder.sh
    networks:
      - ${NETWORK_NAME}
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
      - source: pgpass
        target: /pgadmin4/.pgpass
    entrypoint: ["/bin/sh", "/create-admin-folder.sh"]
    restart: always

configs:
  servers.json:
    content: |
      {
        "Servers": {
          "${PGADMIN_SERVER_ID_TABIT}": {
            "Name": "${PGADMIN_SERVER_NAME_TABIT}",
            "Group": "${PGADMIN_SERVER_GROUP_TABIT}",
            "Host": "${DB_CONTAINER_NAME}",
            "Port": ${DB_PORT},
            "SSLMode": "${SSL_MODE}",
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "PassFile": "/.pgpass"
          }
        }
      }
  pgpass:
    content: |
        ${DB_CONTAINER_NAME}:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

volumes:
  postgres_data:
    driver: local
    name: ${DB_VOLUME_NAME}
  pgadmin_data:
    driver: local
    name: ${PGADMIN_VOLUME_NAME}
  app_media:
    driver: local
    name: ${MEDIA_VOLUME_NAME}

networks:
  tabit_network:
    driver: ${NETWORK_DRIVER}
