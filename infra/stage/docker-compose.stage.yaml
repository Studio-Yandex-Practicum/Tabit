services:
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:${POSTGRES_VERSION}
    # Определение пути расположения файла с переменными окружения на сервере.
    env_file:
      - /home/dev_deploy/tabit/infra/stage/.env
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    container_name: tabit
    image: ${CONTAINER_REGISTRY}/${IMAGE_NAME}:latest
    # Определение пути расположения файла с переменными окружения на сервере.
    env_file:
      - /home/dev_deploy/tabit/infra/stage/.env
    environment:
      - POETRY_VIRTUALENVS_IN_PROJECT=true
      - PATH="/app/.venv/bin:$PATH"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - db
    volumes:
      - app_media:/app/media
    restart: always

  pgadmin:
    container_name: ${PGADMIN_CONTAINER_NAME}
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    # Определение пути расположения файла с переменными окружения на сервере.
    env_file:
      - /home/dev_deploy/tabit/infra/stage/.env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    # В stage-окружении servers.json и pgpass задаются жестко через файл.
    # Такой подход позволяет быстро подменить файлы на сервере без пересборки образа.
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - /home/dev_deploy/tabit/pgadmin/servers.json:/pgadmin4/servers.json
      - /home/dev_deploy/tabit/pgadmin/config_local.py:/pgadmin4/config_local.py
      - /home/dev_deploy/tabit/pgadmin/.pgpass:/pgadmin4/.pgpass
      - /home/dev_deploy/tabit/pgadmin/create-admin-folder.sh:/create-admin-folder.sh
    entrypoint: ["/bin/sh", "/create-admin-folder.sh"]
    restart: always

volumes:
  postgres_data:
    driver: local
    name: ${DB_VOLUME_NAME}
  pgadmin_data:
    driver: local
    name: ${PGADMIN_VOLUME_NAME}
  app_media:
    driver: local
    name: ${MEDIA_VOLUME_NAME}
